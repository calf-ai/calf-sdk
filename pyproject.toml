[project]
name = "calfkit"
# Version is release-please-managed: the manifest holds the source of truth and the
# release PR patches $.project.version here (see release-please-config.json extra-files).
version = "0.13.0"
description = "A framework to build powerful AI agent teams."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Calf AI" }]
keywords = ["ai", "agents", "kafka", "event-driven", "workflows", "llm", "distributed", "decoupled"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

# Born-new cutover: the legacy implementation lives on branch `legacy/0.13`.
# Dependencies arrive with the implementation, section by section.
dependencies = []

[project.urls]
Homepage = "https://github.com/calf-ai/calfkit-sdk"
Repository = "https://github.com/calf-ai/calfkit-sdk"
Issues = "https://github.com/calf-ai/calfkit-sdk/issues"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
lint = ["import-linter>=2.13"]

# ── Import contracts (layout v2, design-log block 52) ─────────────────────────
# These encode the sketch's per-section "depends on:" annotations as CI-enforced
# rules. layers/forbidden are transitive; `protected` pins each heavy SDK to its
# single adapter module (activated as the adapters land).
[tool.importlinter]
root_packages = ["calfkit"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture — the sketch's dependency order"
type = "layers"
layers = [
    "calfkit.worker",
    "calfkit._processors",
    "calfkit._hosting",
    "calfkit._wire",
    "calfkit._drive",
    "calfkit._surface",
    "calfkit._capabilities",
    "calfkit._engine | calfkit._carriage | calfkit._projection | calfkit._policy",
    "calfkit.definitions",
    "calfkit.hooks | calfkit.lifecycle",
    "calfkit.providers",
    "calfkit.models",
    "calfkit.ports | calfkit.mcp",
    "calfkit.context",
    "calfkit.schemas",
    "calfkit.messages | calfkit.streaming",
    "calfkit.errors",
]

[[tool.importlinter.contracts]]
name = "The core never imports adapters"
type = "forbidden"
source_modules = [
    "calfkit.messages",
    "calfkit.streaming",
    "calfkit.errors",
    "calfkit.schemas",
    "calfkit.context",
    "calfkit.ports",
    "calfkit.mcp",
    "calfkit.models",
    "calfkit.providers",
    "calfkit.hooks",
    "calfkit.lifecycle",
    "calfkit.definitions",
    "calfkit._engine",
    "calfkit._carriage",
    "calfkit._projection",
    "calfkit._policy",
    "calfkit._surface",
    "calfkit._capabilities",
    "calfkit._drive",
    "calfkit._wire",
    "calfkit._hosting",
    "calfkit._processors",
]
forbidden_modules = ["calfkit.adapters"]

