[project]
name = "calfkit"
# release-please patches this field (see release-please-config.json extra-files)
version = "0.13.0"
description = "A framework to build powerful AI agent teams."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Calf AI" }]
keywords = ["ai", "agents", "kafka", "event-driven", "workflows", "llm", "distributed", "decoupled"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

dependencies = []

[project.urls]
Homepage = "https://github.com/calf-ai/calfkit-sdk"
Repository = "https://github.com/calf-ai/calfkit-sdk"
Issues = "https://github.com/calf-ai/calfkit-sdk/issues"

[build-system]
requires = ["uv_build>=0.9.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
lint = ["import-linter>=2.13"]

[tool.ruff]
target-version = "py310"
line-length = 150
# ruff >=0.16 reformats Python code blocks inside Markdown; the docs hold
# deliberate fragments
extend-exclude = ["*.md", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
extend-select = ["ANN", "PYI"]
preview = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
# importlib is the recommended import mode for new projects (pytest good
# practices); tests/ carries no __init__.py files
addopts = ["--import-mode=importlib"]
strict = true

[tool.ty.src]
exclude = [".agents"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.importlinter]
root_packages = ["calfkit"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture — the sketch's dependency order"
type = "layers"
layers = [
    "calfkit.worker",
    "calfkit._processors",
    "calfkit._hosting",
    "calfkit._wire",
    "calfkit._drive",
    "calfkit._surface",
    "calfkit._capabilities",
    "calfkit._engine | calfkit._carriage | calfkit._projection | calfkit._policy",
    "calfkit.definitions",
    "calfkit.hooks | calfkit.lifecycle",
    "calfkit.providers",
    "calfkit.models",
    "calfkit.ports | calfkit.mcp",
    "calfkit.context",
    "calfkit.schemas",
    "calfkit.messages | calfkit.streaming",
    "calfkit.errors",
]

[[tool.importlinter.contracts]]
name = "The core never imports adapters"
type = "forbidden"
source_modules = [
    "calfkit.messages",
    "calfkit.streaming",
    "calfkit.errors",
    "calfkit.schemas",
    "calfkit.context",
    "calfkit.ports",
    "calfkit.mcp",
    "calfkit.models",
    "calfkit.providers",
    "calfkit.hooks",
    "calfkit.lifecycle",
    "calfkit.definitions",
    "calfkit._engine",
    "calfkit._carriage",
    "calfkit._projection",
    "calfkit._policy",
    "calfkit._surface",
    "calfkit._capabilities",
    "calfkit._drive",
    "calfkit._wire",
    "calfkit._hosting",
    "calfkit._processors",
]
forbidden_modules = ["calfkit.adapters"]

