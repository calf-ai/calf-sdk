name: CI

# Always-on checks sharing the push-to-main / PR trigger: lint + format +
# types, import contracts, lockfile freshness, and a package build with
# cross-OS install verification. The test matrix and the gated integration
# lanes return with the implementation (pytest is not yet a dependency).
# Lanes with divergent triggers stay in their own files: security, release,
# pr-title. Shared Python+uv setup is factored into .github/actions/setup.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup

      - name: Ruff lint
        run: uv run --group dev ruff check .

      - name: Ruff format check
        run: uv run --group dev ruff format --check .

      - name: ty type check
        run: uv run --group dev ty check

  imports:
    name: Import contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup
        with:
          groups: "lint"

      - name: Check import contracts
        run: uv run --group lint lint-imports

  lockfile:
    name: Lockfile up to date
    runs-on: ubuntu-latest

    # Its own gate: `uv run` silently re-locks a stale lockfile and exits 0,
    # so a stale uv.lock can only be caught by checking it directly.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: ./.github/actions/setup
        with:
          groups: "" # `uv lock --check` reads the files; it needs no synced venv

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: ./.github/actions/setup
        with:
          groups: "" # `uv build` needs no synced venv

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  verify:
    name: Verify install • ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # Linux x64
          - macos-15-intel # macOS Intel
          - macos-latest # macOS Apple Silicon
          - windows-latest # Windows x64

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install wheel
        run: pip install dist/*.whl
        shell: bash

      - name: Verify import
        run: python -c "import calfkit; from importlib.metadata import version; print(f'calfkit {version(\"calfkit\")} installed successfully')"
        shell: bash
